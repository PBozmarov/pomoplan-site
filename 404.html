<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="robots" content="noindex">
  <title>Page not found — PomoPlan</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/site.js" defer></script>
</head>
<body class="inner-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header is-scrolled" data-site-header>
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="PomoPlan home"><img class="brand-icon" src="/assets/app-icon.png" alt="" width="40" height="40"><span>PomoPlan</span></a>
      <nav class="site-nav simple-nav" aria-label="Primary navigation"><a href="/support/">Support</a><a href="/privacy/">Privacy</a></nav>
    </div>
  </header>
  <main class="not-found" id="main-content">
    <div class="not-found-grid shell">
      <div data-reveal>
        <p class="eyebrow"><span class="signal-dot"></span> Signal lost / 404</p>
        <h1>This page took<br><em>a break.</em></h1>
        <p>The address may have changed, or this route never entered the queue.</p>
        <a class="button button-primary" href="/"><span>Return to PomoPlan</span></a>
      </div>
      <div class="not-found-cat" data-reveal>
        <span>Resting, not missing.</span>
        <img src="/assets/cat-dozing.svg" alt="PomoPlan cat sleeping" width="495" height="340">
      </div>
    </div>
  </main>
</body>
</html>
